    post:
      operationId: createLabCertificate
      tags: [labcerts]
      summary: Ingest a lab certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabCertificateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabCertificate"

  /lab-certificates/{id}:
    patch:
      operationId: updateLabCertificate
      tags: [labcerts]
      summary: Update a lab certificate
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
