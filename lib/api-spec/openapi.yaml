  /dashboard/registry-comparison:
    get:
      operationId: getRegistryComparison
      tags: [dashboard]
      summary: Compare credit value across Puro.earth, Verra, EBC for eligible batches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryComparison"

  /dashboard/compliance-health:
    get:
      operationId: getComplianceHealth
      tags: [dashboard]
      summary: Compliance health — upcoming deadlines and conflict warnings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceHealth"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── SITE ────────────────────────────────────────────────────────────────
    Site:
      type: object
      required: [id, name, location, status, createdAt]
      properties:
        id:       { type: integer }
        name:     { type: string }
        location: { type: string }
        country:  { type: ["string", "null"] }
        status:   { type: string, enum: [active, inactive, pending] }
        timezone: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SiteInput:
      type: object
      required: [name, location]
      properties:
        name:     { type: string, minLength: 1 }
        location: { type: string }
        country:  { type: string }
        status:   { type: string, enum: [active, inactive, pending] }
        timezone: { type: string }

    SiteUpdate:
      type: object
      properties:
        name:     { type: string }
        location: { type: string }
        country:  { type: string }
        status:   { type: string, enum: [active, inactive, pending] }
        timezone: { type: string }

    # ── BATCH ────────────────────────────────────────────────────────────────
    Batch:
      type: object
      required: [id, siteId, batchCode, stage, status, createdAt]
      properties:
        id:          { type: integer }
        siteId:      { type: integer }
        batchCode:   { type: string }
        description: { type: ["string", "null"] }
        stage:
          type: string
          enum: [collect, quantify, assurance, verify, comply, report]
        status:
          type: string
          enum: [in_progress, blocked, completed, verified, allocated]
        productionDate:      { type: ["string", "null"], format: date }
        totalBiomassKg:      { type: ["number", "null"] }
        totalBiocharKg:      { type: ["number", "null"] }
        estimatedCo2e:       { type: ["number", "null"] }
        permanenceDiscount:  { type: ["number", "null"] }
        netCo2e:             { type: ["number", "null"] }
        assignedTo:          { type: ["string", "null"] }
        createdAt:           { type: string, format: date-time }
        updatedAt:           { type: string, format: date-time }

    BatchInput:
      type: object
      required: [siteId, batchCode]
      properties:
        siteId:         { type: integer }
        batchCode:      { type: string, minLength: 1 }
        description:    { type: string }
        productionDate: { type: string, format: date }
        assignedTo:     { type: string }

    BatchUpdate:
      type: object
      properties:
        batchCode:      { type: string }
        description:    { type: string }
        stage:          { type: string, enum: [collect, quantify, assurance, verify, comply, report] }
        status:         { type: string, enum: [in_progress, blocked, completed, verified, allocated] }
        productionDate: { type: string, format: date }
        assignedTo:     { type: string }

    # ── FEEDSTOCK ENTRY ──────────────────────────────────────────────────────
    FeedstockEntry:
      type: object
      required: [id, batchId, biomassSource, biomassType, quantityKg, createdAt]
      properties:
        id:              { type: integer }
        batchId:         { type: integer }
        biomassSource:   { type: string }
        biomassType:     { type: string }
        quantityKg:      { type: number }
        moisturePercent: { type: ["number", "null"] }
        supplier:        { type: ["string", "null"] }
        collectionDate:  { type: ["string", "null"], format: date }
        notes:           { type: ["string", "null"] }
        createdAt:       { type: string, format: date-time }

    FeedstockEntryInput:
      type: object
      required: [batchId, biomassSource, biomassType, quantityKg]
      properties:
        batchId:         { type: integer }
        biomassSource:   { type: string }
        biomassType:     { type: string }
        quantityKg:      { type: number }
        moisturePercent: { type: number }
        supplier:        { type: string }
        collectionDate:  { type: string, format: date }
        notes:           { type: string }

    FeedstockEntryUpdate:
      type: object
      properties:
        biomassSource:   { type: string }
        biomassType:     { type: string }
        quantityKg:      { type: number }
        moisturePercent: { type: number }
        supplier:        { type: string }
        collectionDate:  { type: string, format: date }
        notes:           { type: string }

    # ── PRODUCTION RECORD ─────────────────────────────────────────────────────
    ProductionRecord:
      type: object
      required: [id, batchId, pyrolysisTemp, residenceTimeMin, createdAt]
      properties:
        id:                  { type: integer }
        batchId:             { type: integer }
        pyrolysisTemp:       { type: number }
        residenceTimeMin:    { type: number }
        feedrateKgH:         { type: ["number", "null"] }
        outputBiocharKg:     { type: ["number", "null"] }
        processingDate:      { type: ["string", "null"], format: date }
        operatorNotes:       { type: ["string", "null"] }
        equipmentId:         { type: ["string", "null"] }
        createdAt:           { type: string, format: date-time }

    ProductionRecordInput:
      type: object
      required: [batchId, pyrolysisTemp, residenceTimeMin]
      properties:
        batchId:          { type: integer }
        pyrolysisTemp:    { type: number }
        residenceTimeMin: { type: number }
        feedrateKgH:      { type: number }
        outputBiocharKg:  { type: number }
        processingDate:   { type: string, format: date }
        operatorNotes:    { type: string }
        equipmentId:      { type: string }

    ProductionRecordUpdate:
      type: object
      properties:
        pyrolysisTemp:    { type: number }
        residenceTimeMin: { type: number }
        feedrateKgH:      { type: number }
        outputBiocharKg:  { type: number }
        processingDate:   { type: string, format: date }
        operatorNotes:    { type: string }
        equipmentId:      { type: string }

    # ── LAB CERTIFICATE ───────────────────────────────────────────────────────
    LabCertificate:
      type: object
      required: [id, batchId, labName, hCorgRatio, organicCarbonPercent, ashPercent, status, createdAt]
      properties:
        id:                    { type: integer }
        batchId:               { type: integer }
        labName:               { type: string }
        certificateRef:        { type: ["string", "null"] }
        hCorgRatio:            { type: number }
        organicCarbonPercent:  { type: number }
        ashPercent:            { type: number }
        phValue:               { type: ["number", "null"] }
        electricalConductivity: { type: ["number", "null"] }
        sampleDate:            { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [pending, verified, flagged, rejected]
        ocrExtracted:          { type: boolean }
        notes:                 { type: ["string", "null"] }
        createdAt:             { type: string, format: date-time }

    LabCertificateInput:
      type: object
      required: [batchId, labName, hCorgRatio, organicCarbonPercent, ashPercent]
      properties:
        batchId:               { type: integer }
        labName:               { type: string }
        certificateRef:        { type: string }
        hCorgRatio:            { type: number }
        organicCarbonPercent:  { type: number }
        ashPercent:            { type: number }
        phValue:               { type: number }
        electricalConductivity: { type: number }
        sampleDate:            { type: string, format: date }
        ocrExtracted:          { type: boolean }
        notes:                 { type: string }

    LabCertificateUpdate:
      type: object
      properties:
        labName:               { type: string }
        certificateRef:        { type: string }
        hCorgRatio:            { type: number }
        organicCarbonPercent:  { type: number }
        ashPercent:            { type: number }
        phValue:               { type: number }
        electricalConductivity: { type: number }
        sampleDate:            { type: string, format: date }
        status:                { type: string, enum: [pending, verified, flagged, rejected] }
        notes:                 { type: string }

    # ── CUSTODY RECORD ────────────────────────────────────────────────────────
    CustodyRecord:
      type: object
      required: [id, batchId, custodyType, party, date, createdAt]
      properties:
        id:                { type: integer }
        batchId:           { type: integer }
        custodyType:
          type: string
          enum: [transport, end_use, storage, transfer]
        party:             { type: string }
        date:              { type: string, format: date }
        destinationSite:   { type: ["string", "null"] }
        transportMethod:   { type: ["string", "null"] }
        quantityKg:        { type: ["number", "null"] }
        evidenceRef:       { type: ["string", "null"] }
        verified:          { type: boolean }
        notes:             { type: ["string", "null"] }
        createdAt:         { type: string, format: date-time }

    CustodyRecordInput:
      type: object
      required: [batchId, custodyType, party, date]
      properties:
        batchId:           { type: integer }
        custodyType:       { type: string, enum: [transport, end_use, storage, transfer] }
        party:             { type: string }
        date:              { type: string, format: date }
        destinationSite:   { type: string }
        transportMethod:   { type: string }
        quantityKg:        { type: number }
        evidenceRef:       { type: string }
        verified:          { type: boolean }
        notes:             { type: string }

    CustodyRecordUpdate:
      type: object
      properties:
        custodyType:       { type: string, enum: [transport, end_use, storage, transfer] }
        party:             { type: string }
        date:              { type: string, format: date }
        destinationSite:   { type: string }
        transportMethod:   { type: string }
        quantityKg:        { type: number }
        evidenceRef:       { type: string }
        verified:          { type: boolean }
        notes:             { type: string }

    # ── MODEL RUN ─────────────────────────────────────────────────────────────
    ModelRun:
      type: object
      required: [id, batchId, registry, biomassCarbonFraction, pyrolysisRetentionFactor, grossCo2e, permanenceDiscount, netCo2e, eligibility, createdAt]
      properties:
        id:                        { type: integer }
        batchId:                   { type: integer }
        registry:
          type: string
          enum: [puro_earth, verra, ebc]
        biomassCarbonFraction:     { type: number }
        pyrolysisRetentionFactor:  { type: number }
        grossCo2e:                 { type: number }
        permanenceDiscount:        { type: number }
        netCo2e:                   { type: number }
        estimatedCreditValue:      { type: ["number", "null"] }
        eligibility:
          type: string
          enum: [eligible, ineligible, conditional]
        eligibilityNotes:          { type: ["string", "null"] }
        creditPrice:               { type: ["number", "null"] }
        createdAt:                 { type: string, format: date-time }

    ModelRunInput:
      type: object
      required: [batchId, registry]
      properties:
        batchId:    { type: integer }
        registry:   { type: string, enum: [puro_earth, verra, ebc] }
        creditPrice: { type: number }

    # ── ASSURANCE ISSUE ───────────────────────────────────────────────────────
    AssuranceIssue:
      type: object
      required: [id, batchId, issueType, severity, status, title, createdAt]
      properties:
        id:              { type: integer }
        batchId:         { type: integer }
        siteId:          { type: ["integer", "null"] }
        issueType:
          type: string
          enum: [out_of_spec, missing_data, sourcing_gap, custody_gap, methodology, anomaly]
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, in_review, resolved, waived]
        title:           { type: string }
        description:     { type: ["string", "null"] }
        assignedTo:      { type: ["string", "null"] }
        autoSubstituted: { type: boolean }
        substituteValue: { type: ["string", "null"] }
        resolvedAt:      { type: ["string", "null"], format: date-time }
        resolvedBy:      { type: ["string", "null"] }
        resolution:      { type: ["string", "null"] }
        createdAt:       { type: string, format: date-time }

    AssuranceIssueInput:
      type: object
      required: [batchId, issueType, severity, title]
      properties:
        batchId:         { type: integer }
        siteId:          { type: integer }
        issueType:       { type: string, enum: [out_of_spec, missing_data, sourcing_gap, custody_gap, methodology, anomaly] }
        severity:        { type: string, enum: [critical, high, medium, low] }
        title:           { type: string }
        description:     { type: string }
        assignedTo:      { type: string }
        autoSubstituted: { type: boolean }
        substituteValue: { type: string }

    AssuranceIssueUpdate:
      type: object
      properties:
        severity:   { type: string, enum: [critical, high, medium, low] }
        status:     { type: string, enum: [open, in_review, resolved, waived] }
        assignedTo: { type: string }
        description: { type: string }

    IssueResolution:
      type: object
      required: [resolution, resolvedBy]
      properties:
        resolution:  { type: string }
        resolvedBy:  { type: string }

    # ── AUDIT EVENT ───────────────────────────────────────────────────────────
    AuditEvent:
      type: object
      required: [id, entityType, entityId, action, actor, createdAt]
      properties:
        id:          { type: integer }
        batchId:     { type: ["integer", "null"] }
        siteId:      { type: ["integer", "null"] }
        entityType:  { type: string }
        entityId:    { type: integer }
        action:      { type: string }
        actor:       { type: string }
        description: { type: ["string", "null"] }
        metadata:    { type: ["string", "null"] }
        createdAt:   { type: string, format: date-time }

    # ── COMPLIANCE DEADLINE ────────────────────────────────────────────────────
    ComplianceDeadline:
      type: object
      required: [id, siteId, registry, deadlineType, dueDate, status, createdAt]
      properties:
        id:            { type: integer }
        siteId:        { type: integer }
        batchId:       { type: ["integer", "null"] }
        registry:      { type: string, enum: [puro_earth, verra, ebc, internal] }
        deadlineType:
          type: string
          enum: [submission, attestation, audit_window, renewal]
        title:         { type: string }
        dueDate:       { type: string, format: date }
        status:
          type: string
          enum: [upcoming, due_soon, overdue, completed, waived]
        assignedTo:    { type: ["string", "null"] }
        reminderDays:  { type: integer }
        conflictsWith: { type: ["integer", "null"] }
        notes:         { type: ["string", "null"] }
        createdAt:     { type: string, format: date-time }

    ComplianceDeadlineInput:
      type: object
      required: [siteId, registry, deadlineType, title, dueDate]
      properties:
        siteId:       { type: integer }
        batchId:      { type: integer }
        registry:     { type: string, enum: [puro_earth, verra, ebc, internal] }
        deadlineType: { type: string, enum: [submission, attestation, audit_window, renewal] }
        title:        { type: string }
        dueDate:      { type: string, format: date }
        assignedTo:   { type: string }
        reminderDays: { type: integer }
        notes:        { type: string }

    ComplianceDeadlineUpdate:
      type: object
      properties:
        title:        { type: string }
        dueDate:      { type: string, format: date }
        status:       { type: string, enum: [upcoming, due_soon, overdue, completed, waived] }
        assignedTo:   { type: string }
        reminderDays: { type: integer }
        notes:        { type: string }

    # ── CREDIT ALLOCATION ─────────────────────────────────────────────────────
    CreditAllocation:
      type: object
      required: [id, batchId, modelRunId, registry, netCo2e, status, createdAt]
      properties:
        id:               { type: integer }
        batchId:          { type: integer }
        modelRunId:       { type: integer }
        registry:         { type: string, enum: [puro_earth, verra, ebc] }
        netCo2e:          { type: number }
        creditValue:      { type: ["number", "null"] }
        revenueUsd:       { type: ["number", "null"] }
        status:
          type: string
          enum: [pending, submitted, issued, retired]
        registryRefId:    { type: ["string", "null"] }
        exportedAt:       { type: ["string", "null"], format: date-time }
        createdAt:        { type: string, format: date-time }

    CreditAllocationInput:
      type: object
      required: [batchId, modelRunId, registry]
      properties:
        batchId:    { type: integer }
        modelRunId: { type: integer }
        registry:   { type: string, enum: [puro_earth, verra, ebc] }
        creditValue: { type: number }

    # ── NOTIFICATION ──────────────────────────────────────────────────────────
    Notification:
      type: object
      required: [id, type, title, read, createdAt]
      properties:
        id:        { type: integer }
        type:
          type: string
          enum: [issue_flagged, deadline_approaching, batch_advanced, verification_needed, allocation_complete, system]
        title:     { type: string }
        body:      { type: ["string", "null"] }
        batchId:   { type: ["integer", "null"] }
        siteId:    { type: ["integer", "null"] }
        read:      { type: boolean }
        createdAt: { type: string, format: date-time }

    # ── DASHBOARD / ANALYTICS ─────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalSites, totalBatches, totalNetCo2e, totalRevenueUsd, openIssues, upcomingDeadlines, siteBreakdown]
      properties:
        totalSites:           { type: integer }
        totalBatches:         { type: integer }
        activeBatches:        { type: integer }
        totalNetCo2e:         { type: number }
        totalRevenueUsd:      { type: number }
        openIssues:           { type: integer }
        criticalIssues:       { type: integer }
        upcomingDeadlines:    { type: integer }
        overdueDeadlines:     { type: integer }
        issuedCredits:        { type: number }
        pendingCredits:       { type: number }
        siteBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SitePerformance"

    SitePerformance:
      type: object
      required: [siteId, siteName, batchCount, netCo2e, revenueUsd, openIssues, complianceScore]
      properties:
        siteId:          { type: integer }
        siteName:        { type: string }
        batchCount:      { type: integer }
        netCo2e:         { type: number }
        revenueUsd:      { type: number }
        openIssues:      { type: integer }
        complianceScore: { type: number }

    PipelineSummary:
      type: object
      required: [collect, quantify, assurance, verify, comply, report]
      properties:
        collect:   { type: integer }
        quantify:  { type: integer }
        assurance: { type: integer }
        verify:    { type: integer }
        comply:    { type: integer }
        report:    { type: integer }

    ActivityItem:
      type: object
      required: [id, type, description, actor, timestamp]
      properties:
        id:          { type: integer }
        type:        { type: string }
        description: { type: string }
        actor:       { type: string }
        batchId:     { type: ["integer", "null"] }
        batchCode:   { type: ["string", "null"] }
        siteId:      { type: ["integer", "null"] }
        siteName:    { type: ["string", "null"] }
        timestamp:   { type: string, format: date-time }

    RegistryComparison:
      type: object
      required: [registries, topRecommendation]
      properties:
        topRecommendation: { type: string }
        registries:
          type: array
          items:
            $ref: "#/components/schemas/RegistrySummary"

    RegistrySummary:
      type: object
      required: [registry, eligibleBatches, totalCo2e, totalRevenue, avgCreditPrice]
      properties:
        registry:       { type: string }
        eligibleBatches: { type: integer }
        totalCo2e:      { type: number }
        totalRevenue:   { type: number }
        avgCreditPrice: { type: number }

    ComplianceHealth:
      type: object
      required: [overallScore, upcomingCount, overdueCount, conflictCount, deadlines]
      properties:
        overallScore: { type: number }
        upcomingCount: { type: integer }
        overdueCount:  { type: integer }
        conflictCount: { type: integer }
        deadlines:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceDeadline"
