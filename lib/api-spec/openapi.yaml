        - { name: siteId, in: query, schema: { type: integer } }
        - { name: entityType, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

  /audit-events/batch/{batchId}:
    get:
      operationId: getBatchAuditTrail
      tags: [audit]
