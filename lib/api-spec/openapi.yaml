openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Biochar Digital MRV Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sites
    description: Site management
  - name: batches
    description: Biochar production batches
  - name: feedstock
    description: Feedstock intake entries
  - name: production
    description: Production records
  - name: labcerts
    description: Lab certificates
  - name: custody
    description: Chain of custody
  - name: model-runs
    description: Carbon quantification model runs
  - name: assurance
    description: Assurance issues and validation
  - name: audit
    description: Audit events and trail
  - name: compliance
    description: Compliance calendar and deadlines
  - name: allocations
    description: Credit allocations and registry reporting
  - name: notifications
    description: Platform notifications
  - name: dashboard
    description: Dashboard and analytics endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── SITES ────────────────────────────────────────────────────────────────
  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List all sites
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  # ── BATCHES ──────────────────────────────────────────────────────────────
  /batches:
    get:
      operationId: listBatches
      tags: [batches]
      summary: List all batches
      parameters:
        - { name: siteId, in: query, schema: { type: integer } }
        - { name: stage, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"
    post:
      operationId: createBatch
      tags: [batches]
      summary: Create a batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{id}:
    get:
      operationId: getBatch
      tags: [batches]
      summary: Get a batch
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "404":
          description: Not found
    patch:
      operationId: updateBatch
      tags: [batches]
      summary: Update a batch
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{id}/advance-stage:
    post:
      operationId: advanceBatchStage
      tags: [batches]
      summary: Advance batch to next MRV stage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  # ── FEEDSTOCK ─────────────────────────────────────────────────────────────
  /feedstock-entries:
    get:
      operationId: listFeedstockEntries
      tags: [feedstock]
      summary: List feedstock entries
      parameters:
        - { name: batchId, in: query, schema: { type: integer } }
        - { name: siteId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedstockEntry"
    post:
      operationId: createFeedstockEntry
      tags: [feedstock]
      summary: Create a feedstock entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedstockEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedstockEntry"

  /feedstock-entries/{id}:
    patch:
      operationId: updateFeedstockEntry
      tags: [feedstock]
      summary: Update a feedstock entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedstockEntryUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedstockEntry"
    delete:
      operationId: deleteFeedstockEntry
      tags: [feedstock]
      summary: Delete a feedstock entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ── PRODUCTION RECORDS ────────────────────────────────────────────────────
  /production-records:
    get:
      operationId: listProductionRecords
      tags: [production]
      summary: List production records
      parameters:
